function match(k,r,f){const m=M[k];if(f.q&&!JSON.stringify(r).toLowerCase().includes(f.q.toLowerCase()))return 0;if(f.subj&&subjOf(r)!==f.subj)return 0;if(f.course&&r.course!==f.course)return 0;

function list(k){const m=M[k],f=F[k]||{},rows=S[k].filter(r=>match(k,r,f)).sort(m.sort||((a,b)=>(b[m.dk||'added']||'').localeCompare(a[m.dk||'added']||'')));

 if(m.cards)return`<div class=g>${rows.map(m.card).join('')}</div>`;
